name: CI

on:
  push:
  pull_request:

jobs:
  build-test-and-smoke:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libeigen3-dev \
            nlohmann-json3-dev \
            python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-experiments.txt pybind11

      - name: Check release-critical files are tracked
        run: |
          python scripts/check_release_readiness.py \
            --repo-root . \
            --tracking-only

      - name: Self-test release tools
        run: python scripts/self_test_release_tools.py

      - name: Configure C++ tests
        run: |
          cmake -S . -B build-ci \
            -DRBF_BUILD_ENVELOPE=ON \
            -DRBF_BUILD_LECT_DATABASE=ON \
            -DRBF_BUILD_SBF=ON \
            -DRBF_BUILD_TESTS=ON \
            -DRBF_WITH_PYTHON=OFF \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON

      - name: Build C++ tests
        run: cmake --build build-ci -j2

      - name: Run CTest
        run: ctest --test-dir build-ci --output-on-failure

      - name: Export public release tree
        run: |
          python scripts/export_public_release.py \
            --out-dir /tmp/RapidBoxForest-public \
            --force

      - name: Check public release tree
        run: |
          python scripts/check_public_release.py \
            /tmp/RapidBoxForest-public \
            --check-release-tools \
            --run-smoke-dry-run

      - name: Build and check public source package
        run: |
          python scripts/package_public_release.py \
            --out-dir /tmp/RapidBoxForest-release \
            --force
          python scripts/check_public_package.py \
            /tmp/RapidBoxForest-release/RapidBoxForest-public.package.json

      - name: Configure Python smoke build
        run: |
          PYBIND11_CMAKE_DIR="$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')"
          cmake -S /tmp/RapidBoxForest-public \
            -B /tmp/RapidBoxForest-python-smoke-build \
            -DRBF_BUILD_ENVELOPE=ON \
            -DRBF_BUILD_LECT_DATABASE=OFF \
            -DRBF_BUILD_SBF=OFF \
            -DRBF_BUILD_TESTS=OFF \
            -DRBF_WITH_PYTHON=ON \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            "-DCMAKE_PREFIX_PATH=${PYBIND11_CMAKE_DIR}"

      - name: Build Python smoke package
        run: cmake --build /tmp/RapidBoxForest-python-smoke-build -j2

      - name: Run Python smoke execute
        run: |
          python /tmp/RapidBoxForest-public/scripts/check_public_release.py \
            /tmp/RapidBoxForest-public \
            --pythonpath /tmp/RapidBoxForest-python-smoke-build/python \
            --check-python-extension \
            --run-smoke-execute
